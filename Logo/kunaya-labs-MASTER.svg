<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 520 114"
     width="1040" height="228"
     shape-rendering="crispEdges">

  <!-- ═══════════════════════════════════════════
       KUNAYA LABS — SOVEREIGN MARK
       Master SVG · Extracted from final HTML
       ViewBox: 520×114
       Render at 2x = 1040×228px (print-ready)
  ═══════════════════════════════════════════ -->

  <!-- BACKGROUND: Absolute void black -->
  <rect width="520" height="114" fill="#06050A"/>

  <!-- ═══════════════════════
       THE MIRRORED K SYMBOL
       ViewBox coords from HTML: 0 0 130 114
       Centered vertically in 114px height
  ═══════════════════════ -->

  <g id="symbol" transform="translate(0, 0)">

    <!-- ── K LEFT ── -->
    <!-- Spine: heavy, square terminals -->
    <line x1="18" y1="8" x2="18" y2="106"
          stroke="#F0EAD8" stroke-width="9" stroke-linecap="square"/>
    <!-- Upper arm: thinner, blade-like -->
    <line x1="27" y1="53" x2="65" y2="8"
          stroke="#F0EAD8" stroke-width="6.5" stroke-linecap="square"/>
    <!-- Lower arm -->
    <line x1="27" y1="61" x2="67" y2="106"
          stroke="#F0EAD8" stroke-width="6.5" stroke-linecap="square"/>

    <!-- Anime speed cut — upper arm trace -->
    <line x1="52" y1="20" x2="58" y2="13"
          stroke="#F0EAD8" stroke-width="2"
          stroke-linecap="square" opacity="0.35"/>

    <!-- ── K RIGHT (mirror) ── -->
    <line x1="112" y1="8" x2="112" y2="106"
          stroke="#F0EAD8" stroke-width="9" stroke-linecap="square"/>
    <line x1="103" y1="53" x2="65" y2="8"
          stroke="#F0EAD8" stroke-width="6.5" stroke-linecap="square"/>
    <line x1="103" y1="61" x2="63" y2="106"
          stroke="#F0EAD8" stroke-width="6.5" stroke-linecap="square"/>

    <!-- Anime speed cut — mirror -->
    <line x1="78" y1="20" x2="72" y2="13"
          stroke="#F0EAD8" stroke-width="2"
          stroke-linecap="square" opacity="0.35"/>

    <!-- ── THE GOLD WEAPON DIAMOND ── -->
    <!-- Ambient glow behind diamond -->
    <ellipse cx="65" cy="57" rx="20" ry="48"
             fill="#C8982A" opacity="0.04"/>

    <!-- Layer 1: Dark base -->
    <polygon points="65,10 70,57 65,104 60,57"
             fill="#7A5810"/>
    <!-- Layer 2: Main gold -->
    <polygon points="65,14 69,57 65,100 61,57"
             fill="#C8982A"/>
    <!-- Layer 3: Upper light catch -->
    <polygon points="65,16 68,42 65,57 62,42"
             fill="#E8B840" opacity="0.7"/>

    <!-- Yantra lines — sacred horizontal cuts -->
    <line x1="62" y1="35" x2="68" y2="35"
          stroke="#F0C84A" stroke-width="0.7" opacity="0.45"/>
    <line x1="61" y1="50" x2="69" y2="50"
          stroke="#F0C84A" stroke-width="0.5" opacity="0.3"/>
    <line x1="61" y1="64" x2="69" y2="64"
          stroke="#F0C84A" stroke-width="0.5" opacity="0.3"/>
    <line x1="62" y1="79" x2="68" y2="79"
          stroke="#F0C84A" stroke-width="0.7" opacity="0.45"/>

    <!-- THE BINDU — absolute center -->
    <circle cx="65" cy="57" r="4.5" fill="#F0C84A"/>
    <circle cx="65" cy="57" r="2"   fill="#FFFAF0"/>

  </g>

  <!-- ═══════════════════════
       VERTICAL SEPARATOR
  ═══════════════════════ -->
  <defs>
    <linearGradient id="sepGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#C8982A" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#C8982A" stop-opacity="0.35"/>
      <stop offset="75%"  stop-color="#C8982A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C8982A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shiroGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#C8982A" stop-opacity="0"/>
      <stop offset="8%"   stop-color="#9A7218" stop-opacity="0.7"/>
      <stop offset="50%"  stop-color="#C8982A" stop-opacity="0.7"/>
      <stop offset="92%"  stop-color="#9A7218" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C8982A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="152" y="31" width="1" height="52"
        fill="url(#sepGrad)"/>

  <!-- ═══════════════════════
       WORDMARK
       Positioned at x=175
       Vertically centered in 114px = y~57
  ═══════════════════════ -->

  <!-- SHIROREKHA — the divine crown line -->
  <!-- Spans wordmark width: x=175 to x=490 -->
  <rect x="175" y="25" width="315" height="1.5"
        fill="url(#shiroGrad)"/>

  <!-- "KUNAYA LABS" — Rajdhani Bold equivalent geometry -->
  <!-- Using SVG text with embedded font reference -->
  <text x="175" y="74"
        font-family="'Rajdhani', 'Barlow Condensed', 'Arial Narrow', sans-serif"
        font-size="48"
        font-weight="700"
        letter-spacing="6"
        fill="#F0EAD8"
        dominant-baseline="auto">KUNAYA LABS</text>

  <!-- "AUTOMATION AGENCY" — lighter, wide tracking, gold -->
  <text x="178" y="92"
        font-family="'Rajdhani', 'Barlow Condensed', 'Arial Narrow', sans-serif"
        font-size="10"
        font-weight="500"
        letter-spacing="5.5"
        fill="#C8982A"
        dominant-baseline="auto">AUTOMATION AGENCY</text>

</svg>
